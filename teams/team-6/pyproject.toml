[project]
name = "citibike-pipeline"
version = "0.1.0"
description = "DATA 622 Final Project: Citi Bike archive inventory, normalization, and station-demand features"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.3",
    "gtfs-realtime-bindings>=1.0",
    "pyarrow>=18",
    "pytz>=2026.5",
    "pyyaml>=6.0",
    "scikit-learn>=1.7",
    "shapely>=2.0",
]

[project.scripts]
citibike = "citibike_pipeline.cli:main"

[dependency-groups]
dev = [
    "databricks-sdk>=0.60",
    "pymupdf>=1.28.2",
    "pytest>=8.0",
    "python-pptx>=1.0.2",
    "reportlab>=5.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citibike_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
