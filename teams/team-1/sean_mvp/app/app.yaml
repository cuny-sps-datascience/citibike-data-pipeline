# Databricks Apps config. Add a SQL warehouse resource with key "sql-warehouse"
# when you create the app; it fills DATABRICKS_WAREHOUSE_ID.
command: ["streamlit", "run", "app.py"]
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: CB_SCHEMA
    value: workspace.default
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
